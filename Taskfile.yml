version: "3"

tasks:
  init:
    desc: Create .env and secrets/, or fill in what is missing
    cmds:
      - ./scripts/init.sh

  check:
    desc: Fail if a variable in .env is empty or the Compose file is invalid
    preconditions:
      - sh: test -f .env
        msg: .env is missing. Run `task init` first.
    cmds:
      - silent: true
        cmd: |
          empty=$(sed -n 's/^\([A-Za-z0-9_]*\)=$/\1/p' .env)
          if [ -n "$empty" ]; then
            printf 'Set these variables in .env:\n%s\n' "$empty" >&2
            exit 1
          fi
      - docker compose config --quiet

  bootstrap:
    desc: Generate secrets, check the configuration and start the stack
    cmds:
      - task: init
      - task: up

  up:
    desc: Start the stack and wait until every service is healthy
    deps:
      - check
    cmds:
      - docker compose up -d --wait

  down:
    desc: Stop and remove the containers. Volumes are kept.
    cmds:
      - docker compose down

  smoke:
    desc: Fail if a service is stopped or unhealthy, or a one-shot job failed
    cmds:
      - ./scripts/smoke.sh

  backup:
    desc: Stop the stack, save volumes, .env and secrets/ to backups/, restart
    cmds:
      - ./scripts/backup.sh

  restore:
    desc: Restore a backup on an empty host (task restore -- backups/<timestamp>)
    cmds:
      - ./scripts/restore.sh "{{.CLI_ARGS}}"
